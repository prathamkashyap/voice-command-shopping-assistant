<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Command Shopping Assistant</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Shopping Assistant</h1>
      <div class="language-selector">
        <label for="language">Language:</label>
        <select id="language">
          <option value="en-US">English (US)</option>
          <option value="hi-IN">Hindi (India)</option>
          <option value="te-IN">Telugu (India)</option>
          <option value="ta-IN">Tamil (India)</option>
        </select>
      </div>
    </header>

    <main class="app-main">
      <section class="voice-input-section">
        <div class="mic-button-container">
          <button id="micButton" class="mic-button" aria-label="Start voice input">
            <svg class="mic-icon" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
              <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
            </svg>
            <svg class="mic-icon listening" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
              <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
              <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
            </svg>
          </button>
          <p class="mic-status" id="micStatus">Tap to speak</p>
        </div>

        <div class="text-input-fallback">
          <label for="textCommand">Or type a command:</label>
          <div class="text-input-wrapper">
            <input type="text" id="textCommand" placeholder="e.g., Add 2 bottles of water" aria-label="Type command">
            <button id="sendCommand" class="btn btn-primary">Send</button>
          </div>
        </div>

        <div class="recognized-text" id="recognizedText" aria-live="polite"></div>
      </section>

      <section class="shopping-list-section">
        <div class="section-header">
          <h2>Shopping List</h2>
          <button id="clearList" class="btn btn-secondary" aria-label="Clear list">Clear List</button>
        </div>

        <div class="shopping-list" id="shoppingList" role="list">
          <p class="empty-state" id="emptyState">Your list is empty. Add items by voice or text.</p>
        </div>

        <div class="suggestions-section" id="suggestionsSection" style="display: none;">
          <h3>Suggestions</h3>
          <div class="suggestions-list" id="suggestionsList"></div>
        </div>
      </section>

      <section class="search-results-section" id="searchResultsSection" style="display: none;">
        <div class="section-header">
          <h2>Search Results</h2>
          <button id="closeSearch" class="btn btn-secondary">Close</button>
        </div>
        <div class="search-results" id="searchResults"></div>
      </section>
    </main>

    <div class="toast-container" id="toastContainer" aria-live="polite"></div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
